<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUTHENTIC</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0e14">
<style>
html,body{margin:0;height:100%;background:#0a0e14;color:#eaf0f7;font-family:sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#msg{padding:24px;line-height:1.6}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .3s;background:#0a0e14}
#boot img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 3px #0a0e14,0 0 0 5px #0e8a53}
</style>
</head>
<body>
<div id="msg" hidden></div>
<div id="boot"><img src="icon-192.png" alt="AUTHENTIC" width="132" height="132"></div>
<iframe id="app" title="AUTHENTIC" allow="clipboard-write"></iframe>
<script>
/* STEP 1: replace the text below with your Apps Script web app link
   (the one that ends with /exec). Keep the quote marks. */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw8YXfqP5RXuZpUAizya0xK5eUSreSS7xINBqYMOQ2lrbPYQFRr7NQVRK6SLa4IV3O4/exec';

var frame = document.getElementById('app');
if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(EXEC_URL)) {
  frame.hidden = true;
  var m = document.getElementById('msg');
  m.hidden = false;
  m.textContent = 'Open index.html and put your Apps Script /exec link in EXEC_URL.';
} else {
  frame.src = EXEC_URL;
  frame.addEventListener('load', function () {
    var b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 400); }
  });
}

/* Chrome offers its own install window through this event. */
var deferred = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
window.addEventListener('appinstalled', function () { deferred = null; });

/* The app talks to this page by messages:
   'hi'      -> this page answers 'hello' with its own link (the app learns where it can be installed from)
   'install' -> Chrome's install window opens; the app is told 'install-ok', or 'install-na' when Chrome gave no window */
function reply(e, msg) { try { e.source.postMessage(msg, e.origin); } catch (x) { /* the app shows the manual steps */ } }
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || (d.authentic !== 'install' && d.authentic !== 'hi')) return;
  var ok = false;
  try {
    var h = new URL(e.origin).hostname;
    ok = /(^|\.)googleusercontent\.com$/.test(h) || /(^|\.)google\.com$/.test(h) || e.origin === new URL(EXEC_URL).origin;
  } catch (x) { ok = false; }
  if (!ok) return;
  if (d.authentic === 'hi') { reply(e, { authentic: 'hello', url: location.href.split('#')[0].split('?')[0] }); return; }
  if (!deferred) { reply(e, { authentic: 'install-na' }); return; }
  var p = deferred;
  deferred = null;
  p.prompt();
  reply(e, { authentic: 'install-ok' });
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
